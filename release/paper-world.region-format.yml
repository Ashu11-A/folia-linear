# Per-world opt-in — paste into the target world's paper-world.yml ONLY
# (e.g. config/worlds/<world>/paper-world.yml). Leave paper-world-defaults.yml at ANVIL.
# Flip ONE low-risk world first (NOT spawn). Restart after editing.
region-format:
  format: LINEAR
  linear:
    compression-level: 1
    crash-on-broken-symlink: true
