# Global — paste into paper-global.yml (top level).
# NOTE (CONFIG-MATRIX K4/K5): these two keys are DECLARED but UNWIRED in this
# release — no NMS code reads them yet, so tuning them is a silent no-op.
# Ship defaults; do NOT present them as tunable until the flusher lands.
# Additional caveat (K4): flush-frequency carries @Constraints.Min(1), so a
# value < 1 fails boot instead of falling back to 10. Keep at >= 1.
region-format:
  linear:
    flush-frequency: 10
    flush-max-threads: 1
