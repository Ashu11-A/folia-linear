# Global snippet - paste into paper-global.yml at the top level.
#
# Both keys below are INERT in this release: they are declared and validated,
# but no code reads them yet, so changing them does nothing. They exist so the
# config surface matches Kaiiju's and a future flush scheduler is a wiring
# change rather than a config break.
#
# A value below 1 for flush-frequency logs an error and falls back to 10.
region-format:
  linear:
    flush-frequency: 10
    flush-max-threads: 1
