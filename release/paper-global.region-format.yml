# Global snippet - paste into paper-global.yml at the top level.
#
# All keys below are INERT at defaults in this release: they are declared and
# validated, but no scheduler or thread pool reads them yet, so changing them
# does nothing while defaults hold. They exist so the config surface matches
# Kaiiju's plus the planned Loop-4 scheduler inputs, and a future flush
# scheduler is a wiring change rather than a config break.
#
# A value below 1 for flush-frequency logs an error and falls back to 10.
# compression-workers and long-distance-matching below 0 fall back to 0.
region-format:
  linear:
    flush-frequency: 10
    flush-max-threads: 1
    compression-workers: 0
    long-distance-matching: 0
    log-flush-batches: false
