name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: "Version folders to build (comma-separated, e.g. '26.1.x'); 'all' builds every folder"
        required: false
        default: 'all'
  release:
    types: [published]

permissions:
  contents: write

env:
  # Upstream pins (repo/branch/ref/MC) are NOT duplicated here: the single
  # source of truth is versions/*/upstream.properties, fanned out to every
  # job by the discover matrix below.
  JAVA_VERSION: 25

jobs:
  discover:
    # Fans out versions/*/upstream.properties into a build matrix (one entry
    # per version). Adding a new MC line = adding a new versions/<line>/
    # directory; no workflow edit needed. On PRs the matrix is path-filtered
    # to the versions actually touched; a change to shared scripts/ or the
    # workflow itself builds every version. Docs-only PRs yield an empty
    # matrix and the gated jobs skip.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: Checkout (full history for the PR diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover versions + PR path filter
        id: set-matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSIONS: ${{ inputs.versions }}
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import re
          import subprocess

          entries = []
          for prop in sorted(glob.glob('versions/*/upstream.properties')):
              version = prop.split('/')[1]
              kv = {}
              with open(prop) as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#') or '=' not in line:
                          continue
                      k, v = line.split('=', 1)
                      kv[k.strip()] = v.strip()
              for key in ('FOLIA_REPO', 'FOLIA_BRANCH', 'FOLIA_REF', 'MC_VERSION'):
                  if not kv.get(key):
                      raise SystemExit(f'discover: {prop} is missing {key}')
              if not re.fullmatch(r'[0-9a-f]{40}', kv['FOLIA_REF']):
                  raise SystemExit(
                      f"discover: {prop} FOLIA_REF must be a full 40-char sha "
                      f"(got {kv['FOLIA_REF']!r})")
              entries.append({
                  'version': version,
                  'mc': kv['MC_VERSION'],
                  'repo': kv['FOLIA_REPO'],
                  'branch': kv['FOLIA_BRANCH'],
                  'ref': kv['FOLIA_REF'],
              })
          if not entries:
              raise SystemExit('discover: no versions/*/upstream.properties found')
          print('discover: versions: ' + ', '.join(
              f"{e['version']} (mc {e['mc']}, {e['branch']}@{e['ref'][:12]})"
              for e in entries))

          keep = list(entries)
          if os.environ.get('EVENT_NAME') == 'pull_request' and os.environ.get('BASE_SHA'):
              base = os.environ['BASE_SHA']
              try:
                  out = subprocess.run(
                      ['git', 'diff', '--name-only', f'{base}...HEAD'],
                      capture_output=True, text=True, check=True).stdout.splitlines()
              except subprocess.CalledProcessError:
                  out = None
                  print('discover: base diff failed; failing open (every version)')
              if out is not None:
                  changed = [c for c in out if c]
                  # Shared code (CI itself + helper scripts) affects every version.
                  shared = [c for c in changed
                            if c.startswith('.github/') or c.startswith('scripts/')]
                  touched = {c.split('/')[1] for c in changed
                             if c.startswith('versions/') and len(c.split('/')) > 2}
                  if shared:
                      print('discover: shared files changed -> every version: '
                            + ', '.join(shared))
                  else:
                      keep = [e for e in entries if e['version'] in touched]
                      print('discover: PR touches versions: '
                            + ', '.join(e['version'] for e in keep))
                      if not keep:
                          print('discover: no build content changed; '
                                'matrix will be empty (gated jobs skip)')

          # Manual dispatch can limit the run to some folders (e.g. a fix
          # that applies to one line, or a partial release re-run via
          # `gh workflow run build.yml --ref <tag> -f versions=<list>`).
          # Empty/'all' builds every version. Unknown names fail fast.
          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              want = (os.environ.get('INPUT_VERSIONS') or 'all').strip()
              if want.lower() not in ('', 'all'):
                  picked = [w.strip() for w in want.split(',') if w.strip()]
                  known = {e['version'] for e in entries}
                  unknown = [w for w in picked if w not in known]
                  if unknown:
                      raise SystemExit(
                          'discover: unknown version folder(s): '
                          + ', '.join(unknown)
                          + f" (have: {', '.join(sorted(known))})")
                  keep = [e for e in entries if e['version'] in picked]
                  print('discover: workflow_dispatch limits versions to: '
                        + ', '.join(e['version'] for e in keep))
                  if not keep:
                      print('discover: empty selection; '
                            'matrix will be empty (gated jobs skip)')

          matrix = {'include': keep}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              gh.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              gh.write(f"count={len(keep)}\n")
          EOF

  preflight:
    # Fast-fail gate (minutes, no Gradle): proves the supplement stages cleanly
    # before the slow build job burns 10+ minutes. Mirrors scripts/preflight.sh.
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout supplement (this repo)
        uses: actions/checkout@v4
        with:
          path: supplement

      - name: Clone pinned Folia base
        run: git clone --branch ${{ matrix.branch }} --single-branch ${{ matrix.repo }} folia && git -C folia rev-parse HEAD

      - name: Stage patches (same commands as the build job)
        run: |
          cp supplement/versions/${{ matrix.version }}/patches/minecraft-*.patch folia/folia-server/minecraft-patches/features/
          cp supplement/versions/${{ matrix.version }}/patches/paper-*.patch    folia/folia-server/paper-patches/features/
          python3 supplement/versions/${{ matrix.version }}/build-hunk.py folia/folia-server/build.gradle.kts.patch
          mkdir -p folia/folia-server/src/test/java/net/linear
          cp supplement/versions/${{ matrix.version }}/tests/*.java folia/folia-server/src/test/java/net/linear/
          git -C folia status --short | head -n 20

      - name: Workflow self-checks (catches the last two CI failures locally)
        run: |
          python3 - <<'EOF'
          import sys
          try:
              import yaml
              yaml.safe_load(open('supplement/.github/workflows/build.yml'))
              print("YAML parse: OK")
          except ImportError:
              print("YAML parse: SKIPPED (no pyyaml on runner)")
          EOF
          echo "--- over-specific jar globs (must be empty):"
          ! grep -rn 'folia-paperclip-26\.1\.2-\*' supplement/.github/workflows/build.yml
          echo "--- gh invocations without explicit repo (must be empty):"
          ! grep -rnE 'gh release (upload|create|edit|delete)' supplement/.github/workflows/build.yml | grep -v '\-\-repo'

  build:
    needs: [discover, preflight]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout supplement (this repo)
        uses: actions/checkout@v4
        with:
          path: supplement

      - name: Disk guard (MC builds need room; fail fast, not ENOSPC)
        run: |
          df -h /
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free=${FREE_GB}GB"
          if [ "$FREE_GB" -lt 25 ]; then
            echo "::error::Need >=25GB free for the Folia build, have ${FREE_GB}GB. Re-run on a larger runner (one-line runs-on change)."
            exit 1
          fi

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clone pinned Folia base
        run: git clone --branch ${{ matrix.branch }} --single-branch ${{ matrix.repo }} folia && git -C folia rev-parse HEAD

      - name: Verify base pin
        run: |
          HEAD=$(git -C folia rev-parse HEAD)
          if [ "$HEAD" != "${{ matrix.ref }}" ]; then
            echo "::warning::Upstream ${{ matrix.branch }} moved ($HEAD). Patches target ${{ matrix.ref }}; continuing, apply step will prove compatibility."
          fi

      - name: Stage Linear patches + tests
        run: |
          cp supplement/versions/${{ matrix.version }}/patches/minecraft-*.patch folia/folia-server/minecraft-patches/features/
          cp supplement/versions/${{ matrix.version }}/patches/paper-*.patch    folia/folia-server/paper-patches/features/
          # Build-file wiring (test srcDir + zstd dep) uses paperweight hunk
          # convention stock git cannot parse -- spliced deterministically,
          # byte-identical to the proven local build; aborts on upstream drift.
          python3 supplement/versions/${{ matrix.version }}/build-hunk.py folia/folia-server/build.gradle.kts.patch
          mkdir -p folia/folia-server/src/test/java/net/linear
          cp supplement/versions/${{ matrix.version }}/tests/*.java folia/folia-server/src/test/java/net/linear/
          git -C folia status --short | head -n 20

      - name: Set git identity (paperweight applies patches via git am)
        run: |
          git config --global user.name "folia-linear-ci"
          git config --global user.email "folia-linear-ci@users.noreply.github.com"

      - name: Apply patches + build paperclip jar
        working-directory: folia
        run: |
          ./gradlew applyAllPatches --stacktrace
          ./gradlew build --stacktrace
          ./gradlew folia-server:createPaperclipJar --stacktrace
          ls -la folia-server/build/libs/ | grep -i paperclip

      - name: Linear test suites (must be green)
        working-directory: folia
        run: ./gradlew :folia-server:test --tests "net.linear.LinearNmsTestSuite" --stacktrace

      - name: Boot smoke (ANVIL fresh world, expect Done)
        run: |
          JAR=$(ls "$GITHUB_WORKSPACE/folia/folia-server/build/libs"/folia-paperclip-*.jar | head -1)
          test -f "$JAR" || { echo "::error::paperclip jar missing:"; ls -la "$GITHUB_WORKSPACE/folia/folia-server/build/libs/" || true; exit 1; }
          echo "JAR=$JAR"
          mkdir -p "$GITHUB_WORKSPACE/smoke-anvil" && cd "$GITHUB_WORKSPACE/smoke-anvil"
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-name=world\n' > server.properties
          timeout 300 java -jar "$JAR" --nogui > boot.log 2>&1 || true
          grep -q 'Done (' boot.log && echo SMOKE-ANVIL-DONE || (tail -n 40 boot.log; exit 1)
          grep -ciE '^\[.*ERROR\]' boot.log || true

      - name: Boot smoke (LINEAR flag, expect .linear emission)
        run: |
          JAR=$(ls "$GITHUB_WORKSPACE/folia/folia-server/build/libs"/folia-paperclip-*.jar | head -1)
          test -f "$JAR" || { echo "::error::paperclip jar missing:"; ls -la "$GITHUB_WORKSPACE/folia/folia-server/build/libs/" || true; exit 1; }
          echo "JAR=$JAR"
          mkdir -p "$GITHUB_WORKSPACE/smoke-linear" && cd "$GITHUB_WORKSPACE/smoke-linear"
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-name=world\n' > server.properties
          timeout 300 java -jar "$JAR" --nogui > boot1.log 2>&1 || true
          grep -q 'Done (' boot1.log || (tail -n 40 boot1.log; exit 1)
          printf 'region-format:\n  format: LINEAR\n' >> world/paper-world.yml
          timeout 300 java -jar "$JAR" --nogui > boot2.log 2>&1 || true
          grep -q 'Done (' boot2.log || (tail -n 40 boot2.log; exit 1)
          find world -name '*.linear' | head -n 5
          test "$(find world -name '*.linear' | wc -l)" -gt 0 && echo SMOKE-LINEAR-EMITS || (echo "::warning::No .linear emitted (an idle world writes nothing)"; exit 0)

      - name: Upload paperclip jar (artifact + release asset)
        uses: actions/upload-artifact@v4
        with:
          name: folia-linear-${{ matrix.mc }}
          path: folia/folia-server/build/libs/folia-paperclip-*.jar
          if-no-files-found: error

      - name: Attach jar to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release asset name depends on the tag scheme:
          #   project tags  v<project> (e.g. v1.4.0, v1.0.0-baseline): every
          #     matrix leg uploads its own per-version asset,
          #     folia-linear-<mcversion>-<project>.jar
          #   legacy tags   v<mcversion>-linear.<build> (history only): the
          #     matching MC leg uploads folia-<mcversion>-<build>.jar
          # A manual dispatch on a tag (`gh workflow run build.yml
          # --ref <tag> -f versions=<list>`) limits the release to some
          # folders; pushed tags always release every version.
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*-linear.*)
              MC="${TAG#v}"; MC="${MC%%-linear.*}"
              BUILD="${TAG##*-linear.}"
              # Multi-version matrix: only the leg matching the tag's MC uploads,
              # so sibling versions never mislabel (or clobber) this asset.
              if [ "$MC" != "${{ matrix.mc }}" ]; then
                echo "Tag targets MC $MC; this leg builds ${{ matrix.mc }} — skipping upload."
                exit 0
              fi
              ASSET="folia-${MC}-${BUILD}.jar"
              ;;
            v*)
              PROJ="${TAG#v}"
              ASSET="folia-linear-${{ matrix.mc }}-${PROJ}.jar"
              ;;
            *)
              echo "::error::Tag '$TAG' is not a project tag (v<project>) or a legacy tag (v<mc>-linear.<build>)"
              exit 1
              ;;
          esac
          echo "asset=$ASSET"
          JAR=$(ls folia/folia-server/build/libs/folia-paperclip-*.jar | head -1)
          cp "$JAR" "$ASSET"
          sha256sum "$ASSET" | tee "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo Ashu11-A/folia-linear --clobber
