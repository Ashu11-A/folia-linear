name: stage
description: >
  Clone the pinned Folia base and stage the Linear supplement for one
  versions/<line> entry (mirrors scripts/build.sh lines 83-100: clone,
  pin checkout/verify, patch+test staging). Owned by the build workflow
  (G2); test.yml (G3) reuses it verbatim — never duplicate these steps inline.

inputs:
  version:
    description: Version folder under versions/ (e.g. '26.1.x'). Comes from the discover matrix (matrix.version). The special value 'all' stages the single versions/*/ entry when the repo holds exactly one (today); with several entries it fails fast so the caller fans out per version instead of silently mixing trees.
    required: true
  supplement-dir:
    description: Path to the already-checked-out supplement repo (must match the setup action's checkout-path).
    required: false
    default: supplement
  folia-dir:
    description: Directory to clone the Folia base into (created if missing).
    required: false
    default: folia
  include-tests:
    description: Stage versions/<line>/tests/*.java into the fork test tree. Keep 'true' for any job that compiles or runs tests (build + test jobs); 'false' only for staging dry-checks.
    required: false
    default: 'true'

outputs:
  repo:
    description: FOLIA_REPO pin read from versions/<line>/upstream.properties.
    value: ${{ steps.props.outputs.repo }}
  branch:
    description: FOLIA_BRANCH pin read from versions/<line>/upstream.properties.
    value: ${{ steps.props.outputs.branch }}
  ref:
    description: FOLIA_REF pin (full 40-char sha) read from versions/<line>/upstream.properties.
    value: ${{ steps.props.outputs.ref }}
  mc:
    description: MC_VERSION read from versions/<line>/upstream.properties.
    value: ${{ steps.props.outputs.mc }}
  folia-dir:
    description: Echo of the folia-dir input (the staged Folia checkout path).
    value: ${{ inputs.folia-dir }}

runs:
  using: composite
  steps:
    - name: Read upstream pin
      id: props
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SUPPLEMENT_DIR: ${{ inputs.supplement-dir }}
      run: |
        if [ "$VERSION" = "all" ]; then
          # Single-version passthrough (documented 'all' mode): resolve the one
          # versions/*/ entry so matrix-less callers (test.yml unit job) work.
          # Multi-version repos must fan out per version (one checkout per line)
          # instead of sharing a tree -- fail fast with that instruction.
          mapfile -t FOUND < <(cd "$SUPPLEMENT_DIR/versions" && ls -d */ | tr -d '/')
          if [ "${#FOUND[@]}" -ne 1 ]; then
            echo "::error::stage 'all' mode needs exactly one versions/*/ entry (found ${#FOUND[@]}); fan out per version instead."
            exit 1
          fi
          VERSION="${FOUND[0]}"
          echo "stage: resolved version 'all' -> '$VERSION'"
        fi
        PROPS="$SUPPLEMENT_DIR/versions/$VERSION/upstream.properties"
        test -f "$PROPS" || { echo "::error::Missing $PROPS"; exit 1; }
        for key in FOLIA_REPO FOLIA_BRANCH FOLIA_REF MC_VERSION; do
          val=$(grep "^${key}=" "$PROPS" | cut -d= -f2-)
          test -n "$val" || { echo "::error::$PROPS is missing $key"; exit 1; }
        done
        FOLIA_REF=$(grep '^FOLIA_REF=' "$PROPS" | cut -d= -f2-)
        case "$FOLIA_REF" in
          ????????????????????????????????????????) ;;
          *) echo "::error::$PROPS FOLIA_REF must be a full 40-char sha (got '$FOLIA_REF')"; exit 1 ;;
        esac
        {
          echo "repo=$(grep '^FOLIA_REPO=' "$PROPS" | cut -d= -f2-)"
          echo "branch=$(grep '^FOLIA_BRANCH=' "$PROPS" | cut -d= -f2-)"
          echo "ref=$FOLIA_REF"
          echo "mc=$(grep '^MC_VERSION=' "$PROPS" | cut -d= -f2-)"
        } >> "$GITHUB_OUTPUT"

    - name: Clone pinned Folia base
      shell: bash
      env:
        FOLIA_DIR: ${{ inputs.folia-dir }}
      run: |
        git clone --branch ${{ steps.props.outputs.branch }} --single-branch ${{ steps.props.outputs.repo }} "$FOLIA_DIR" \
          && git -C "$FOLIA_DIR" rev-parse HEAD

    - name: Verify base pin
      shell: bash
      env:
        FOLIA_DIR: ${{ inputs.folia-dir }}
      run: |
        HEAD=$(git -C "$FOLIA_DIR" rev-parse HEAD)
        if [ "$HEAD" != "${{ steps.props.outputs.ref }}" ]; then
          echo "::warning::Upstream ${{ steps.props.outputs.branch }} moved ($HEAD). Patches target ${{ steps.props.outputs.ref }}; continuing, apply step will prove compatibility."
        fi

    - name: Stage Linear patches + tests
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SUPPLEMENT_DIR: ${{ inputs.supplement-dir }}
        FOLIA_DIR: ${{ inputs.folia-dir }}
        INCLUDE_TESTS: ${{ inputs.include-tests }}
      run: |
        cp "$SUPPLEMENT_DIR/versions/$VERSION"/patches/minecraft-*.patch "$FOLIA_DIR/folia-server/minecraft-patches/features/"
        cp "$SUPPLEMENT_DIR/versions/$VERSION"/patches/paper-*.patch    "$FOLIA_DIR/folia-server/paper-patches/features/"
        # Build-file wiring (test srcDir + zstd dep) uses the paperweight hunk
        # convention stock git cannot parse -- spliced deterministically,
        # byte-identical to the proven local build; aborts on upstream drift.
        python3 "$SUPPLEMENT_DIR/versions/$VERSION/build-hunk.py" "$FOLIA_DIR/folia-server/build.gradle.kts.patch"
        if [ "$INCLUDE_TESTS" = "true" ]; then
          mkdir -p "$FOLIA_DIR/folia-server/src/test/java/net/linear"
          cp "$SUPPLEMENT_DIR/versions/$VERSION"/tests/*.java "$FOLIA_DIR/folia-server/src/test/java/net/linear/"
        fi
        git -C "$FOLIA_DIR" status --short | head -n 20
